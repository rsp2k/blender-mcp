# BlenderMCP FastMCP server — caddy-docker-proxy on the warehack.ing fabric.
#
# Service naming:
#   The single reverse-proxy target is named `blender-mcp` (and `blender-mcp-dev`
#   for the dev profile). Generic names like `server` / `app` / `mcp` would
#   collide on the shared external `caddy` network — Docker Compose aliases the
#   service name on every joined network and the caddy fabric is host-wide.
#
# TLS / ACME:
#   `caddy.tls.import: rfc2136_local` references the rfc2136 DNS-01 snippet
#   defined on the host Caddy. Without it, fresh certificate issuance falls
#   back to 127.0.0.11 (Docker's embedded DNS, which doesn't know warehack.ing)
#   and the ACME challenge silently loops forever.
#
# Streaming MCP labels:
#   FastMCP's streamable-HTTP transport at /mcp holds connections open
#   indefinitely (SSE-style). Caddy's default WebSocket-style idle timeouts
#   close them around 60s, which manifests as MCP dispatch errors and dropped
#   tool calls. The flush_interval / read_timeout / write_timeout / keepalive /
#   stream_timeout block below disables those defaults so long-lived MCP
#   streams survive. Documented in ~/.claude/CLAUDE.md "HMR Behind Reverse
#   Proxy" — the same pattern applies to any long-lived stream behind Caddy.

services:
  # ---- Postgres (Phase I shared-bus persistence) ------------------------
  # UNIQUE container name + dedicated `internal` network per CLAUDE.md
  # "Use UNIQUE service names" — generic `postgres` on the shared caddy
  # fabric collides with other stacks' DBs. NOT on the caddy network;
  # the DB should never be reverse-proxied.
  blender-mcp-postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-blender-mcp}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blender_mcp}
      POSTGRES_DB: ${POSTGRES_DB:-blender_mcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - blender-mcp-pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-blender_mcp} -d $${POSTGRES_DB:-blender_mcp}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ---- Object storage (Garage) for payloads too big for MCP --------------
  # OPTIONAL, behind the `storage` profile: without it (and without
  # STORAGE_DOMAIN in .env) the stack runs as before and the storage tools
  # answer "storage not configured". `make prod` adds the profile when
  # STORAGE_DOMAIN is set.
  #
  # Clients never send bytes through MCP: the server hands out presigned
  # URLs and callers/Blender PUT and GET here directly, so the S3 port IS
  # publicly reachable, on STORAGE_DOMAIN. A SigV4 signature covers the Host
  # header; caddy-docker-proxy's reverse_proxy passes Host through untouched,
  # which is why URLs signed for STORAGE_DOMAIN verify inside the container.
  #
  # Garage starts empty. The server bootstraps it on first use through the
  # admin API (port 3903, token-protected, never proxied): node layout,
  # the S3_ACCESS_KEY import, the bucket and its expiry rule. All idempotent,
  # so there is no init container (the image is a bare binary, no shell).
  # The admin and RPC ports are reachable from other containers on the caddy
  # network, guarded by GARAGE_ADMIN_TOKEN and GARAGE_RPC_SECRET.
  blender-mcp-garage:
    profiles: ["storage"]
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.4.1}
    container_name: ${COMPOSE_PROJECT_NAME:-blender-mcp}-garage
    restart: unless-stopped
    environment:
      # Empty values make Garage refuse to start, which is the safe failure.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    volumes:
      - ./packaging/garage.toml:/etc/garage.toml:ro
      - blender-mcp-garagedata:/var/lib/garage
    networks:
      - caddy
      - internal
    labels:
      caddy: ${STORAGE_DOMAIN:-storage.invalid}
      caddy.reverse_proxy: "{{upstreams 3900}}"
      # Stream large bodies both ways instead of buffering them in Caddy.
      caddy.reverse_proxy.flush_interval: "-1"
      caddy.reverse_proxy.transport: "http"
      caddy.reverse_proxy.transport.read_timeout: "0"
      caddy.reverse_proxy.transport.write_timeout: "0"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  blender-mcp:
    build:
      context: .
      target: prod
    image: ${COMPOSE_PROJECT_NAME:-blender-mcp}-prod
    container_name: ${COMPOSE_PROJECT_NAME:-blender-mcp}-prod
    restart: unless-stopped
    depends_on:
      blender-mcp-postgres:
        condition: service_healthy
    environment:
      # Phase I: shared-bus DB. asyncpg scheme — see storage/__init__.py.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-blender_mcp}:${POSTGRES_PASSWORD}@blender-mcp-postgres:5432/${POSTGRES_DB:-blender_mcp}
      # Legacy AUTH_BACKEND=inmemory vars. Not required for the OAuth path
      # (AUTH_BACKEND=authentik) — server will fall back to ephemeral values
      # at startup with a WARNING if these are missing AND inmemory is selected.
      OAUTH_SECRET_KEY: ${OAUTH_SECRET_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional — passed through if set in .env, app defaults otherwise.
      # ``:-<default>`` is required (not ``:-``) because the Python defaults
      # only fire when ``os.getenv`` returns None, NOT when it returns "". A
      # bare ``${VAR:-}`` passes the empty string, then int("") raises.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      BLENDER_MCP_HOST: ${BLENDER_MCP_HOST:-0.0.0.0}
      BLENDER_MCP_PORT: ${BLENDER_MCP_PORT:-8000}
      # Tool-call instrumentation (off | meta | full) into ffb_tool_calls.
      QA_LOG: ${QA_LOG:-off}
      QA_LOG_STDERR: ${QA_LOG_STDERR:-}
      # Phase G — OAuth backend selection. ``authentik`` (default) requires the
      # AUTHENTIK_* vars below. ``inmemory`` falls back to BlenderMCPOAuthProvider
      # against the USERS dict (local dev only).
      AUTH_BACKEND: ${AUTH_BACKEND:-authentik}
      AUTHENTIK_CONFIG_URL: ${AUTHENTIK_CONFIG_URL:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://mcp.blender.bet}
      # Object storage — see blender-mcp-garage above and object_storage.py.
      # Empty unless STORAGE_DOMAIN is set, which leaves storage "not configured".
      S3_ENDPOINT: ${STORAGE_DOMAIN:+http://blender-mcp-garage:3900}
      S3_PUBLIC_URL: ${STORAGE_DOMAIN:+https://${STORAGE_DOMAIN}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-blender-mcp}
      GARAGE_ADMIN_URL: ${STORAGE_DOMAIN:+http://blender-mcp-garage:3903}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
      STORAGE_RETENTION_DAYS: ${STORAGE_RETENTION_DAYS:-7}
      STORAGE_URL_EXPIRY_S: ${STORAGE_URL_EXPIRY_S:-900}
      STORAGE_OUTPUT_URL_EXPIRY_S: ${STORAGE_OUTPUT_URL_EXPIRY_S:-21600}
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-5368709120}
      # In-Blender chat (src/blender_mcp/chat). Off unless CHAT_ENABLED=true.
      # GPU_API_KEY and CHAT_SECRET_KEY are secrets: set them in .env only.
      CHAT_ENABLED: ${CHAT_ENABLED:-false}
      GPU_BASE_URL: ${GPU_BASE_URL:-https://blender-chat.gpu.supported.systems/v1}
      GPU_API_KEY: ${GPU_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3}
      CHAT_VISION_MODEL: ${CHAT_VISION_MODEL:-qwen2.5vl}
      CHAT_MAX_STEPS: ${CHAT_MAX_STEPS:-6}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-2048}
      CHAT_LLM_TIMEOUT_S: ${CHAT_LLM_TIMEOUT_S:-120}
      CHAT_TURN_TIMEOUT_S: ${CHAT_TURN_TIMEOUT_S:-300}
      CHAT_APPROVAL_TIMEOUT_S: ${CHAT_APPROVAL_TIMEOUT_S:-120}
      CHAT_MAX_TOOLS: ${CHAT_MAX_TOOLS:-40}
      CHAT_TOOLS: ${CHAT_TOOLS:-}
      CHAT_GATEWAY_USERS: ${CHAT_GATEWAY_USERS:-}
      CHAT_SECRET_KEY: ${CHAT_SECRET_KEY:-}
    networks:
      - caddy
      - internal
    labels:
      # Primary hostname + optional alias list (for graceful URL renames).
      # ``${VAR:+,suffix}`` expands to ",suffix" only if VAR is set, so
      # DOMAIN_ALIASES="mcp.l.warehack.ing" yields:
      #   caddy: mcp.blender.bet, mcp.l.warehack.ing
      # Each comma-separated host becomes a separate vhost; Caddy issues a
      # cert for each automatically. Drop the alias once the rename has
      # settled (no more clients targeting the old name).
      caddy: ${DOMAIN:?DOMAIN must be set in .env}${DOMAIN_ALIASES:+, ${DOMAIN_ALIASES}}
      caddy.reverse_proxy: "{{upstreams 8000}}"
      caddy.encode: zstd gzip
      # Streaming MCP survival — see file header for rationale.
      # The bare ``transport: http`` label is required: caddy-docker-proxy
      # renders ``caddy.reverse_proxy.transport.*`` as a ``transport { ... }``
      # block, but Caddy needs an explicit transport TYPE before the block
      # (``transport http { ... }``). Without it, Caddyfile parsing rejects
      # the whole reverse_proxy directive at load time.
      caddy.reverse_proxy.flush_interval: "-1"
      caddy.reverse_proxy.transport: "http"
      caddy.reverse_proxy.transport.read_timeout: "0"
      caddy.reverse_proxy.transport.write_timeout: "0"
      caddy.reverse_proxy.transport.keepalive: "5m"
      caddy.reverse_proxy.stream_timeout: "24h"
    # Dockerfile already declares a healthcheck against /health via python
    # urllib (slim image has no curl/wget). Not overriding it here.

  # Static file server for the self-hosted Blender extension repo. Shares
  # the mcp.blender.bet vhost with blender-mcp above via caddy-docker-proxy's
  # per-service label merging: the handle_path_0 directive here matches
  # /extensions/* FIRST and strips the prefix before forwarding, so this
  # container just serves ./dist/extensions as its own root. Everything
  # else on mcp.blender.bet falls through to blender-mcp's reverse_proxy.
  #
  # Built artifacts are produced locally by scripts/build_extension.py
  # and mounted read-only. When bump_addon_version.py rebuilds, this
  # container sees the new files on the next request (no restart needed
  # because it's just a file server).
  blender-mcp-extensions:
    image: caddy:2.10-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-blender-mcp}-extensions
    restart: unless-stopped
    volumes:
      - ./dist/extensions:/srv:ro
      - ./packaging/extensions.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - caddy
    labels:
      caddy: ${DOMAIN:?DOMAIN must be set in .env}${DOMAIN_ALIASES:+, ${DOMAIN_ALIASES}}
      caddy.handle_path_0: /extensions/*
      caddy.handle_path_0.reverse_proxy: "{{upstreams 80}}"

  # Dev variant — `docker compose --profile dev up`.
  # DO NOT run alongside prod: both bind the same DOMAIN on the caddy fabric
  # and caddy-docker-proxy will pick whichever container started last,
  # producing confusing flapping. Use one or the other.
  blender-mcp-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: ${COMPOSE_PROJECT_NAME:-blender-mcp}-dev
    container_name: ${COMPOSE_PROJECT_NAME:-blender-mcp}-dev
    restart: unless-stopped
    depends_on:
      blender-mcp-postgres:
        condition: service_healthy
    # Override the image CMD — uvicorn with --reload picks up source changes
    # from the mounted volumes below. The ASGI app lives at
    # ``blender_mcp.oauth_server:app`` (FastAPI + mounted FastMCP), NOT at
    # ``blender_mcp.server`` (which doesn't exist).
    command:
      - uvicorn
      - blender_mcp.oauth_server:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
      - --reload-dir
      - /app/addon
    environment:
      OAUTH_SECRET_KEY: ${OAUTH_SECRET_KEY:?OAUTH_SECRET_KEY must be set in .env (JWT signing key)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env (bootstraps admin user)}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      BLENDER_MCP_HOST: ${BLENDER_MCP_HOST:-0.0.0.0}
      BLENDER_MCP_PORT: ${BLENDER_MCP_PORT:-8000}
      # Tool-call instrumentation (off | meta | full) into ffb_tool_calls.
      QA_LOG: ${QA_LOG:-off}
      QA_LOG_STDERR: ${QA_LOG_STDERR:-}
      # Phase G — OAuth backend selection. ``authentik`` (default) requires the
      # AUTHENTIK_* vars below. ``inmemory`` falls back to BlenderMCPOAuthProvider
      # against the USERS dict (local dev only).
      AUTH_BACKEND: ${AUTH_BACKEND:-authentik}
      AUTHENTIK_CONFIG_URL: ${AUTHENTIK_CONFIG_URL:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://mcp.blender.bet}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-blender_mcp}:${POSTGRES_PASSWORD}@blender-mcp-postgres:5432/${POSTGRES_DB:-blender_mcp}
      # Empty unless STORAGE_DOMAIN is set, which leaves storage "not configured".
      S3_ENDPOINT: ${STORAGE_DOMAIN:+http://blender-mcp-garage:3900}
      S3_PUBLIC_URL: ${STORAGE_DOMAIN:+https://${STORAGE_DOMAIN}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-blender-mcp}
      GARAGE_ADMIN_URL: ${STORAGE_DOMAIN:+http://blender-mcp-garage:3903}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
      STORAGE_RETENTION_DAYS: ${STORAGE_RETENTION_DAYS:-7}
      STORAGE_URL_EXPIRY_S: ${STORAGE_URL_EXPIRY_S:-900}
      STORAGE_OUTPUT_URL_EXPIRY_S: ${STORAGE_OUTPUT_URL_EXPIRY_S:-21600}
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-5368709120}
      # In-Blender chat (src/blender_mcp/chat). Off unless CHAT_ENABLED=true.
      # GPU_API_KEY and CHAT_SECRET_KEY are secrets: set them in .env only.
      CHAT_ENABLED: ${CHAT_ENABLED:-false}
      GPU_BASE_URL: ${GPU_BASE_URL:-https://blender-chat.gpu.supported.systems/v1}
      GPU_API_KEY: ${GPU_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3}
      CHAT_VISION_MODEL: ${CHAT_VISION_MODEL:-qwen2.5vl}
      CHAT_MAX_STEPS: ${CHAT_MAX_STEPS:-6}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-2048}
      CHAT_LLM_TIMEOUT_S: ${CHAT_LLM_TIMEOUT_S:-120}
      CHAT_TURN_TIMEOUT_S: ${CHAT_TURN_TIMEOUT_S:-300}
      CHAT_APPROVAL_TIMEOUT_S: ${CHAT_APPROVAL_TIMEOUT_S:-120}
      CHAT_MAX_TOOLS: ${CHAT_MAX_TOOLS:-40}
      CHAT_TOOLS: ${CHAT_TOOLS:-}
      CHAT_GATEWAY_USERS: ${CHAT_GATEWAY_USERS:-}
      CHAT_SECRET_KEY: ${CHAT_SECRET_KEY:-}
      # Force unbuffered output so uvicorn reload logs flush to `docker logs`.
      PYTHONUNBUFFERED: "1"
    volumes:
      # Live source mounts — uvicorn --reload watches these dirs.
      - ./src:/app/src
      - ./addon:/app/addon
    networks:
      - caddy
      - internal
    labels:
      caddy: ${DOMAIN:?DOMAIN must be set in .env}${DOMAIN_ALIASES:+, ${DOMAIN_ALIASES}}
      caddy.reverse_proxy: "{{upstreams 8000}}"
      caddy.encode: zstd gzip
      caddy.reverse_proxy.flush_interval: "-1"
      caddy.reverse_proxy.transport.read_timeout: "0"
      caddy.reverse_proxy.transport.write_timeout: "0"
      caddy.reverse_proxy.transport.keepalive: "5m"
      caddy.reverse_proxy.stream_timeout: "24h"

networks:
  caddy:
    external: true
  # Private network for blender-mcp ↔ blender-mcp-postgres (and the
  # server's admin calls to blender-mcp-garage). Not on the shared caddy
  # fabric so the DB never gets accidentally proxied.
  internal:
    driver: bridge

volumes:
  blender-mcp-pgdata:
  blender-mcp-garagedata:
