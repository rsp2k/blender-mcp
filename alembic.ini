# Alembic config for the Phase I shared-bus schema.
#
# DATABASE_URL is injected at runtime by storage/migrations/env.py from
# the env var, so ``sqlalchemy.url`` here is intentionally left blank.
# That keeps the connection string out of the repo + makes the same
# alembic config work across dev / prod / CI.

[alembic]
script_location = src/blender_mcp/storage/migrations
prepend_sys_path = src
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]
# (no-op — we run ``ruff`` separately in CI)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
