# BlenderMCP user-facing web — caddy-docker-proxy on the warehack.ing fabric.
#
# Serves blender.bet apex:
#   /               — static landing (prerendered)
#   /login-complete — SSR page, forward_auth gated (reads Authentik headers)
#
# Two services share the `caddy` external network:
#   web      — default (prod), Node SSR via standalone Astro server
#   web-dev  — profile `dev`, Astro HMR survived by Caddy
#
# Authentik forward_auth flow:
#   1. Browser hits /login-complete*
#   2. Caddy invokes forward_auth → Authentik embedded outpost
#   3. Outpost checks .blender.bet session cookie:
#      - present + valid → 200 + X-Authentik-* headers → Caddy forwards
#        the request to Astro with those headers attached
#      - missing → 302 to Authentik login → user authenticates → callback
#        sets the cookie → user lands back at the original URL
#   4. The Astro SSR page reads the headers via Astro.request.headers

services:
  web:
    build:
      context: .
      target: prod
    image: ${COMPOSE_PROJECT_NAME:-blender-mcp-web}-prod
    container_name: ${COMPOSE_PROJECT_NAME:-blender-mcp-web}-prod
    restart: unless-stopped
    environment:
      # Web BFF OAuth — web/ is an OAuth client of MCP_SERVER_URL and
      # talks to it over HTTPS. No direct DB access — every /buses page
      # round-trips through the MCP server's REST API for both bus +
      # member data. SESSION_COOKIE_KEY must be 64 hex chars; rotating
      # invalidates all sessions. ${VAR:?} fails compose-up loudly if
      # unset rather than silently producing an unusable container.
      SESSION_COOKIE_KEY: ${SESSION_COOKIE_KEY:?SESSION_COOKIE_KEY must be set (openssl rand -hex 32)}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-https://mcp.blender.bet}
      SITE_URL: ${SITE_URL:-https://blender.bet}
    networks:
      - caddy
    labels:
      caddy: ${DOMAIN:?DOMAIN must be set in .env}${DOMAIN_ALIASES:+, ${DOMAIN_ALIASES}}
      # Caddy verifies DNS-01 propagation against public resolvers (not
      # Docker's embedded DNS, which doesn't know blender.bet).
      caddy.tls.resolvers: "1.1.1.1 9.9.9.9"
      caddy.tls.propagation_delay: 60s
      caddy.tls.propagation_timeout: 600s
      caddy.encode: zstd gzip

      # ---- Authentik proxy outpost integration ----
      # Authentik's proxy outpost lives at https://auth.supported.systems
      # behind paths under /outpost.goauthentik.io/. The browser hits THIS
      # site (blender.bet) on those paths after Authentik's OAuth flow
      # bounces the user back — so we MUST proxy them through to the
      # upstream outpost or the callback 404s on Astro. The `0_` prefix
      # makes Caddy evaluate this matcher BEFORE the catch-all below.
      caddy.@outpost.path: /outpost.goauthentik.io/*
      caddy.0_reverse_proxy: "@outpost https://auth.supported.systems"
      caddy.0_reverse_proxy.header_up: "Host {upstream_hostport}"

      # Path matcher: gate authenticated routes with forward_auth.
      # Apex `/` + future public routes stay reachable without auth.
      # Phase I8 added /buses + /buses/[id] — both SSR pages that read
      # X-Authentik-Username from the forwarded headers. The /oauth/*
      # and /api/* paths are gated too — they're part of the BFF flow
      # for browser-side writes (revoke member, etc.). Gating /oauth/*
      # in particular means the user is ALREADY Authentik-authed when
      # we send them to mcp.blender.bet/authorize, so they only see
      # the OAuth consent screen, not a full Authentik login.
      caddy.@protected.path: /login-complete* /buses /buses/* /oauth/* /api/*
      caddy.forward_auth: "@protected https://auth.supported.systems"
      caddy.forward_auth.uri: /outpost.goauthentik.io/auth/caddy
      caddy.forward_auth.copy_headers: X-Authentik-Username X-Authentik-Email X-Authentik-Name X-Authentik-Groups X-Authentik-Uid

      # Catch-all reverse_proxy to Astro (no path matcher = matches everything
      # not claimed by the @outpost matcher above).
      caddy.reverse_proxy: "{{upstreams 4321}}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/", "-O", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Dev variant — `docker compose --profile dev up`
  web-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: ${COMPOSE_PROJECT_NAME:-blender-mcp-web}-dev
    container_name: ${COMPOSE_PROJECT_NAME:-blender-mcp-web}-dev
    restart: unless-stopped
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      HMR_HOST: ${DOMAIN:?DOMAIN must be set in .env}
      HMR_PROTOCOL: wss
      HMR_CLIENT_PORT: "443"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - caddy
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 4321}}"
      # HMR survival — Vite doesn't ping, so override Caddy's WS idle defaults.
      caddy.reverse_proxy.flush_interval: "-1"
      caddy.reverse_proxy.transport: "http"
      caddy.reverse_proxy.transport.read_timeout: "0"
      caddy.reverse_proxy.transport.write_timeout: "0"
      caddy.reverse_proxy.transport.keepalive: "5m"
      caddy.reverse_proxy.stream_timeout: "24h"

networks:
  caddy:
    external: true
