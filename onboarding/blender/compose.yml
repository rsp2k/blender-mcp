# Blender desktop instance "onboarding" (generated by blender-instance; edit freely).
# Pulls the published image, so nothing here builds. Values come from .env.
services:
  blender-onboarding:
    image: ${BLENDER_IMAGE:-git.supported.systems/rsp2k/blender-desktop}:${BLENDER_VERSION:-5.2.2}${BLENDER_FLAVOR:+-${BLENDER_FLAVOR}}
    container_name: ${COMPOSE_PROJECT_NAME}
    # Stable hostname: identity leases written into the config volume record
    # pid@hostname, and the default hostname (the container id) changes on
    # every recreate, which would orphan them.
    hostname: blender-onboarding
    restart: unless-stopped
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:?set VNC_PASSWORD in .env}
      VNC_VIEWONLY_PASSWORD: ${VNC_VIEWONLY_PASSWORD:-}
      VNC_WATCH_ENABLED: ${VNC_WATCH_ENABLED:-1}
      VNC_ALLOW_RESIZE: ${VNC_ALLOW_RESIZE:-0}
      BLENDER_MAX_FPS: ${BLENDER_MAX_FPS:-24}
      # No colon: an empty value means stock Blender, not the default template.
      BLENDER_APP_TEMPLATE: ${BLENDER_APP_TEMPLATE-supported}
      BLENDER_STARTUP_SCENE: ${BLENDER_STARTUP_SCENE:-}
      WATCH_MAX_CPU: ${WATCH_MAX_CPU:-15}
      VNC_GEOMETRY: ${VNC_GEOMETRY:-1920x1080}
      VNC_DEPTH: ${VNC_DEPTH:-24}
      GPU_VIEWPORT: ${GPU_VIEWPORT:-1}
      NOVNC_ENABLED: ${NOVNC_ENABLED:-1}
      BLENDER_RESTART: ${BLENDER_RESTART:-1}
      WINDOW_MANAGER: ${WINDOW_MANAGER:-i3}
      I3_MOD: ${I3_MOD:-Mod4}
      I3_LAYOUT: ${I3_LAYOUT:-default}
      BLENDER_ARGS: ${BLENDER_ARGS:-}
      BLENDER_ONLINE_ACCESS: ${BLENDER_ONLINE_ACCESS:-1}
      BLENDER_SHOW_SPLASH: ${BLENDER_SHOW_SPLASH:-0}
      BLENDER_EXTENSION_REPOS: ${BLENDER_EXTENSION_REPOS:-}
      BLENDER_EXTENSIONS: ${BLENDER_EXTENSIONS:-}
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: ${SHM_SIZE:-2g}
    # Time for Blender to save preferences and quit on stop/restart.
    stop_grace_period: 30s
    # CPU ceiling: a busy viewport or agent can otherwise take several cores.
    cpus: ${BLENDER_CPUS:-4}
    ports:
      - "${VNC_BIND:-127.0.0.1}:${VNC_PORT:?set VNC_PORT in .env}:5901"
      - "${VNC_BIND:-127.0.0.1}:${VNC_WATCH_PORT:?set VNC_WATCH_PORT in .env}:5902"
    volumes:
      - ./projects:/home/blender/projects
      - blender-config:/home/blender/.config/blender
      # uv cache, uvx tool envs and managed Pythons, so MCP servers survive recreates
      - uv-cache:/home/blender/.cache/uv
    networks:
      - caddy
    labels:
      blender-desktop.instance: "onboarding"
      blender-desktop.dir: ${INSTANCE_DIR:-}
      blender-desktop.vnc_port: ${VNC_PORT}
      blender-desktop.vnc_watch_port: ${VNC_WATCH_PORT}
      caddy: ${WEB_HOSTNAME:?set WEB_HOSTNAME in .env}
      caddy.redir: "/ /vnc.html?autoconnect=true&resize=${NOVNC_RESIZE:-scale}"
      caddy.reverse_proxy: "{{upstreams 6080}}"
      caddy.reverse_proxy.flush_interval: "-1"
      caddy.reverse_proxy.transport: "http"
      caddy.reverse_proxy.transport.read_timeout: "0"
      caddy.reverse_proxy.transport.write_timeout: "0"
      caddy.reverse_proxy.stream_timeout: "24h"
      caddy.reverse_proxy.stream_close_delay: "5s"
      caddy_1: ${WATCH_HOSTNAME:?set WATCH_HOSTNAME in .env}
      caddy_1.redir: "/ /vnc.html?autoconnect=true&view_only=true&resize=scale&reconnect=true"
      caddy_1.reverse_proxy: "{{upstreams 6081}}"
      caddy_1.reverse_proxy.flush_interval: "-1"
      caddy_1.reverse_proxy.transport: "http"
      caddy_1.reverse_proxy.transport.read_timeout: "0"
      caddy_1.reverse_proxy.transport.write_timeout: "0"
      caddy_1.reverse_proxy.stream_timeout: "24h"
      caddy_1.reverse_proxy.stream_close_delay: "5s"

volumes:
  blender-config:
  uv-cache:

networks:
  caddy:
    external: true
