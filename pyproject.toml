[project]
name = "blender-mcp"
version = "1.2"
description = "Blender integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Ryan Malloy", email = "ryan@supported.systems"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Pinned to current latest as the new floor (2026-05-23).
    "fastmcp>=3.3.1",
    "mcp[cli]>=1.27.1",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "pydantic>=2.13.4",
    "click>=8.4.1",
    "websockets>=16.0",
    "requests>=2.34.2",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.5.0",
    "psutil>=7.2.2",
    # Phase I: shared-bus persistence (Postgres + SQLAlchemy + Alembic)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",         # async driver for runtime
    "psycopg[binary]>=3.2.3",  # sync driver used by alembic at migration time
    "alembic>=1.14.0",
]

[project.optional-dependencies]
oauth = [
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "cryptography>=44.0.0",
    "bcrypt>=5.0.0",
]
ai = [
    "numpy>=2.2.6",
    "sentence-transformers>=5.1.0",
]
production = [
    "redis>=5.2.0",
    "psycopg2-binary>=2.9.10",
]
test = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-mock>=3.15.0",
    "httpx>=0.28.1",
]
dev = [
    "blender-mcp[test,oauth]",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
blender-mcp = "blender_mcp.oauth_server:main"
blender-mcp-stdio = "blender_mcp.server_proper:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[dependency-groups]
dev = [
    "fake-bpy-module-latest>=20260501",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/blender-mcp"
"Bug Tracker" = "https://github.com/yourusername/blender-mcp/issues"
