name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the ruff step diffs against the previous commit

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra oauth --group dev

      - name: Syntax check (the extension build refuses to ship a module that doesn't parse)
        run: uv run python -m compileall -q addon src scripts

      - name: Build script parses
        run: uv run python scripts/build_extension.py --help > /dev/null

      - name: Tests
        run: uv run pytest -q

      # The tree has ~880 pre-existing ruff findings, so lint only the Python
      # files this push or PR touched, report them as annotations, and don't
      # fail the build on them.
      - name: Ruff (changed files)
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          [ -n "$BASE_SHA" ] || { echo "No base commit to diff against"; exit 0; }
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files changed"
            exit 0
          fi
          uv run ruff check --output-format=github "${files[@]}"
